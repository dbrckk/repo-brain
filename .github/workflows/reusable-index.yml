name: Reusable Repo Brain index

on:
  workflow_call:
    inputs:
      commit_changes:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Fetch Repo Brain indexer
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/dbrckk/repo-brain/v3/brain/index_repo.py -o /tmp/repo-brain-index.py
          curl -fsSL https://raw.githubusercontent.com/dbrckk/repo-brain/v3/brain/merge_ast_grep.py -o /tmp/repo-brain-merge-outline.py

      - name: Generate symbol intelligence
        shell: bash
        run: |
          python3 /tmp/repo-brain-index.py
          test -s .ai/brain/index.json
          test -s .ai/brain/symbols.json
          test -s .ai/brain/imports.json
          test -s .ai/brain/code-graph.json
          test -s .ai/brain/lookup.json
          test -s .ai/brain/summary.md

      - name: Generate ast-grep outline
        shell: bash
        continue-on-error: true
        run: |
          npm install -g @ast-grep/cli@0.44.0
          ast-grep outline . --items all --view expanded --json=compact > .ai/brain/ast-grep-outline.raw.json

      - name: Compact ast-grep outline
        shell: bash
        if: always()
        run: |
          python3 /tmp/repo-brain-merge-outline.py
          rm -f .ai/brain/ast-grep-outline.raw.json
          test -s .ai/brain/capabilities.json
          test -s .ai/brain/outline.json

      - name: Commit Repo Brain context
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          git add -A .ai/brain
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai): refresh repo brain"
          git push origin "HEAD:${GITHUB_REF_NAME}"


      - name: Upload Repo Brain context
        if: ${{ !inputs.commit_changes }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-brain
          path: .ai/brain/**
          include-hidden-files: true
          if-no-files-found: error
