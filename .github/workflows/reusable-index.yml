name: Reusable Repo Brain index

on:
  workflow_call:
    inputs:
      commit_changes:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 100
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Checkout Repo Brain tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/repo-brain
          ref: main
          path: .repo-brain-tool
          persist-credentials: false
          fetch-depth: 1

      - name: Generate symbol intelligence
        shell: bash
        run: |
          python3 .repo-brain-tool/brain/incremental_index.py
          test -s .ai/brain/index.json
          test -s .ai/brain/symbols.json
          test -s .ai/brain/imports.json
          test -s .ai/brain/code-graph.json
          test -s .ai/brain/lookup.json
          test -s .ai/brain/summary.md
          test -s .ai/brain/incremental-state.json
          test -s .ai/brain/impact.json
          test -s .ai/brain/selected-tests.json

      - name: Generate ast-grep outline
        shell: bash
        continue-on-error: true
        run: |
          npm install -g @ast-grep/cli@0.44.0
          mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(".ai/brain/incremental-state.json")
          print(json.loads(p.read_text()).get("mode","full"))
          PY
          )"
          if [ "$mode" = "incremental" ]; then
            mapfile -t changed < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".ai/brain/impact.json").read_text())
          for path in data.get("changed_source_files", []):
              print(path)
          PY
            )
            if [ "${#changed[@]}" -eq 0 ]; then
              printf '[]\n' > .ai/brain/ast-grep-outline.raw.json
            else
              ast-grep outline "${changed[@]}" --items all --view expanded --json=compact > .ai/brain/ast-grep-outline.raw.json
            fi
          else
            ast-grep outline . --items all --view expanded --json=compact > .ai/brain/ast-grep-outline.raw.json
          fi

      - name: Compact ast-grep outline
        shell: bash
        if: always()
        run: |
          python3 .repo-brain-tool/brain/merge_ast_grep.py
          rm -f .ai/brain/ast-grep-outline.raw.json
          echo "Repo Brain AST files:"
          find .ai/brain -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          python3 - <<'PY'
          from pathlib import Path
          required_files = [
              Path(".ai/brain/capabilities.json"),
              Path(".ai/brain/ast-routing.json"),
          ]
          required_dirs = [
              Path(".ai/brain/ast-symbols"),
              Path(".ai/brain/file-outlines"),
          ]
          missing = [str(p) for p in required_files if not p.is_file() or p.stat().st_size == 0]
          missing += [str(p) for p in required_dirs if not p.is_dir()]
          if missing:
              raise SystemExit("Missing Repo Brain AST outputs: " + ", ".join(missing))
          PY

      - name: Generate changed-symbol references
        shell: bash
        run: |
          python3 .repo-brain-tool/brain/references.py
          test -s .ai/brain/references.json
          test -s .ai/brain/symbol-dependencies.json

      - name: Generate semantic routing plan
        shell: bash
        run: |
          python3 .repo-brain-tool/brain/semantic_plan.py
          python3 .repo-brain-tool/brain/scip_compact.py
          test -s .ai/brain/semantic-plan.json
          test -s .ai/brain/semantic-index.json

      - name: Generate persistent search shards
        shell: bash
        run: |
          python3 .repo-brain-tool/brain/search_index.py
          test -s .ai/brain/search-manifest.json
          test -d .ai/brain/search-shards
          if [ ! -s .ai/brain/query-cache.json ]; then
            printf '{"schema_version":1,"generated_by":"dbrckk/repo-brain-query-cache-v1","entries":{}}\n' > .ai/brain/query-cache.json
          fi
          test -s .ai/brain/query-cache.json

      - name: Enrich and compact graph routing
        shell: bash
        run: |
          python3 .repo-brain-tool/brain/enrich_graph.py
          test -s .ai/brain/graph-enrichment.json
          python3 .repo-brain-tool/brain/graph_compact.py
          test -s .ai/brain/graph-index.json
          test -s .ai/brain/reverse-deps.json
          test -s .ai/brain/graph-manifest.json
          test -d .ai/brain/graph-shards
          test -s .ai/brain/architecture.mmd

      - name: Precompute v6 hotset and context packets
        shell: bash
        run: |
          python3 .repo-brain-tool/brain/precompute.py
          test -s .ai/brain/hotset.json
          test -s .ai/brain/context-manifest.json
          test -s .ai/brain/hash-cache.json
          test -d .ai/brain/context

      - name: Commit Repo Brain context
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          git add -A .ai/brain
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai): refresh repo brain"
          git push origin "HEAD:${GITHUB_REF_NAME}"


      - name: Upload Repo Brain context
        if: ${{ !inputs.commit_changes }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-brain
          path: .ai/brain/**
          include-hidden-files: true
          if-no-files-found: error
