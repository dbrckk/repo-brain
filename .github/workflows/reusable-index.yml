name: Reusable Repo Brain index

on:
  workflow_call:
    inputs:
      commit_changes:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
          ref: ${{ github.ref_name }}

      - name: Fetch Repo Brain indexer
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/dbrckk/repo-brain/v1/brain/index_repo.py -o /tmp/repo-brain-index.py

      - name: Generate symbol intelligence
        shell: bash
        run: |
          python3 /tmp/repo-brain-index.py
          test -s .ai/brain/index.json
          test -s .ai/brain/symbols.json
          test -s .ai/brain/imports.json
          test -s .ai/brain/code-graph.json
          test -s .ai/brain/summary.md

      - name: Commit Repo Brain context
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          git add -A .ai/brain
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai): refresh repo brain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
